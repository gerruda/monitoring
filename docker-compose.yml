# Общий мониторинг для всех ботов на одном VPS.
# Prometheus и Grafana слушают ТОЛЬКО 127.0.0.1; доступ — через SSH-туннель.
# host-network нужен, чтобы Prometheus видел metrics-listener'ы ботов на loopback.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: monitoring-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.listen-address=127.0.0.1:9091
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 220m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: monitoring-grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 220m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
