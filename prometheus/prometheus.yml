# Общий Prometheus для всех ботов на VPS.
# Таргеты ботов лежат отдельными файлами в /etc/prometheus/targets/*.yml
# и подхватываются автоматически (file_sd, refresh 30s) — перезапуск не нужен.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "bots"
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s

  # Сам Prometheus — чтобы в Grafana были up/process-метрики.
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9091"]
